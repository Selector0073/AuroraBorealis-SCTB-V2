name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build, Package, Sign and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nim environment
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Execute test suite via Makefile
        run: make arbiter-test

      - name: Compile release binaries via Makefile
        run: make release-arbiter

      - name: Import GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "GPG_FPR=$FPR" >> "$GITHUB_ENV"

      - name: Package and sign
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          TARGET_DIR="release-arbiter"
          [ -d "$TARGET_DIR" ] || { echo "Error: $TARGET_DIR not found"; exit 1; }

          ARCHIVE="release-arbiter-${{ github.ref_name }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$TARGET_DIR" .

          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user "$GPG_FPR" \
              --detach-sign --armor "$ARCHIVE"

          gpg --armor --export "$GPG_FPR" > public-key.asc

          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import public-key.asc
          gpg --batch --verify "$ARCHIVE.asc" "$ARCHIVE"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-arbiter-*.tar.gz
            release-arbiter-*.tar.gz.asc
            public-key.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
